# dbt profile — Snowflake, RSA key-pair auth only (no password secret).
#
# This file is project-local and safe to commit: every value resolves from an
# env var at runtime. Nothing sensitive lives here, and the private key is
# never in the repo (see .gitignore: *.p8 / *.pem).
#
# Select the target with DBT_TARGET (default: dev).
#
# Key material by context (auth plan — see issue #9 story 2, steam-infra #43):
#   - local dev : developer generates their own PKCS#8 key, registers the
#                 public half on their Snowflake user
#                 (ALTER USER <u> SET RSA_PUBLIC_KEY=...), points
#                 SNOWFLAKE_PRIVATE_KEY_PATH at the .p8 file.
#   - ci        : key stored as a GitHub Actions secret, written to a temp
#                 file by the workflow, SNOWFLAKE_PRIVATE_KEY_PATH points at it.
#   - prod      : k8s Secret (RSA key-pair) injected as the
#                 SNOWFLAKE_PRIVATE_KEY env var (raw PEM content, no file) on
#                 the Cosmos/Airflow pod on steam-infra's EKS, mirroring
#                 steam-infra #43's Secret pattern. Wired in Phase 11
#                 (Orchestration). dbt-snowflake's Connections class accepts
#                 either `private_key` (content) or `private_key_path` (file)
#                 -- content is simpler here, no volume mount needed.
#
# Required env vars (all targets):
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_DATABASE, SNOWFLAKE_ROLE
#   dev/ci: SNOWFLAKE_PRIVATE_KEY_PATH (file)
#   prod:   SNOWFLAKE_PRIVATE_KEY (content)
#
# SNOWFLAKE_ROLE has no default on purpose. It used to fall back to
# TRANSFORMER / TRANSFORMING, neither of which exists in the account, so an
# unset variable produced an obscure "role does not exist" at connect time
# instead of saying which variable was missing. The real names are
# TRANSFORMER_PROD for prod (steam-infra's k8s/airflow/values.yaml sets it)
# and, from steam-infra #115/#116, DEVELOPER for dev and CI for ci.
#
# Caveat: that only fails loudly when the variable is genuinely *unset*.
# env_var raises on unset, not on empty, and a GitHub Actions secret that
# does not exist arrives as the empty string -- so in the workflows a missing
# SNOWFLAKE_ROLE secret still yields a session with no role rather than a
# named error. The workflows' Snowflake identities are rewired in
# steam-infra #116; fixing it properly belongs there.
#
# SNOWFLAKE_DATABASE is the database this target *builds into*. Sources read
# the raw database instead, from their own SNOWFLAKE_RAW_DATABASE and
# SNOWFLAKE_SOURCE_SCHEMA (defaults STEAM_RAW / STEAM_RDS) -- see
# models/staging/steam/_steam__sources.yml.
#
# Optional:
#   SNOWFLAKE_SCHEMA (dev and prod only -- a fallback for models with no
#     +schema config; real schemas come from macros/generate_schema_name.sql),
#   SNOWFLAKE_WAREHOUSE (default COMPUTE_WH, the account's only one),
#   DBT_THREADS,
#   DBT_ENV_SECRET_SNOWFLAKE_KEY_PASSPHRASE (only if the key is encrypted),
#   DBT_CI_SCHEMA (ci target's per-PR scratch schema)

steam_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:

    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      # Fallback schema only — real schemas come from
      # macros/generate_schema_name.sql (folder-derived).
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'dbt_dev') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_KEY_PASSPHRASE', '') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"

    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_KEY_PASSPHRASE', '') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'prod') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_KEY_PASSPHRASE', '') }}"
      threads: "{{ env_var('DBT_THREADS', '8') | int }}"
