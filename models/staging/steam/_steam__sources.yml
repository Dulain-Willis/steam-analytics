version: 2

sources:
  - name: steam
    description: >
      steam-infra CDC landing tables — flattened, schematized Debezium
      change events (see ADR 0001). One table per steam-infra OLTP table.
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: "{{ env_var('SNOWFLAKE_SOURCE_SCHEMA', 'PUBLIC') }}"
    config:
      loaded_at_field: to_timestamp_ltz(__source_ts_ms, 3)
      freshness:
        warn_after: { count: 12, period: hour }
        error_after: { count: 24, period: hour }
    tables:
      - name: users
      - name: games
      - name: game_prices
      - name: marketing_campaigns
      - name: purchases
      - name: ownership_grants
      - name: gifts
      - name: key_redemptions
      - name: refunds
      - name: family_shares
      - name: wishlist_items
      - name: playtime_sessions
        config:
          freshness:
            warn_after: { count: 3, period: hour }
            error_after: { count: 12, period: hour }
      - name: reviews
      - name: price_changes
      - name: concurrent_player_snapshots
        config:
          freshness:
            warn_after: { count: 1, period: hour }
            error_after: { count: 3, period: hour }
      - name: client_events
        config:
          freshness:
            warn_after: { count: 2, period: hour }
            error_after: { count: 6, period: hour }
