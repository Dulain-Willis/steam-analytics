version: 2

models:
  - name: stg_steam__users
    description: One row per user. Type-1, latest attributes only.
    # No recorded_at on this table (low-frequency reference data) - volume
    # only, keyed on the column that actually changes, created_at.
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: created_at
          config:
            severity: warn
    columns:
      - name: user_id
        tests: [unique, not_null]

  - name: stg_steam__games
    description: One row per game. Type-1, latest attributes only.
    # No freshness_anomalies here either, same reason as stg_steam__users
    # above: low-frequency reference data, no recorded_at.
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: created_at
          config:
            severity: warn
    columns:
      - name: game_id
        tests: [unique, not_null]

  - name: stg_steam__game_prices
    description: One row per (game, region) current price.
    # Same reason as stg_steam__users - no freshness_anomalies.
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: updated_at
          config:
            severity: warn
    columns:
      - name: game_price_id
        tests: [unique, not_null]

  - name: stg_steam__marketing_campaigns
    description: One row per marketing campaign.
    # Same reason as stg_steam__users - no freshness_anomalies.
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: created_at
          config:
            severity: warn
    columns:
      - name: marketing_campaign_id
        tests: [unique, not_null]

  - name: stg_steam__purchases
    description: One row per purchase.
    # recorded_at is arrival time, not purchased_at's event time - the
    # anomaly tests below watch arrival volume/cadence, complementing (not
    # duplicating) the fixed-threshold source freshness check on this same
    # table (see CONTEXT.md, Pipeline Health).
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: recorded_at
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: recorded_at
          config:
            severity: warn
    columns:
      - name: purchase_id
        tests: [unique, not_null]

  - name: stg_steam__ownership_grants
    description: One row per ownership grant (purchase, gift, or key redemption).
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: recorded_at
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: recorded_at
          config:
            severity: warn
    columns:
      - name: ownership_grant_id
        tests: [unique, not_null]

  - name: stg_steam__gifts
