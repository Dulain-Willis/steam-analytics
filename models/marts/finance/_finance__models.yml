version: 2

models:
  - name: fct_finance_revenue_daily
    description: >
      One row per date x users.country x is_chargeback. Refunds deduct in
      the period they were refunded, not the original purchase period.
      Country is null until the users.country infra ticket lands (soft
      block, CONTEXT.md). Singular tests in tests/ cover non-negative
      measures and that refunds deduct by refund_date, not purchase_date.
    columns:
      - name: finance_revenue_daily_key
        tests: [unique, not_null]
      - name: revenue_date
        tests: [not_null]
      - name: is_chargeback
        tests: [not_null]

  - name: fct_finance_capacity_daily
    description: >
      One row per date. peak_concurrent_players is the daily max of
      platform-wide concurrent players (summed across games per snapshot).
      Singular test in tests/ covers non-negative measures.
    columns:
      - name: finance_capacity_daily_key
        tests: [unique, not_null]
      - name: capacity_date
        tests: [unique, not_null]
      - name: peak_concurrent_players
        tests: [not_null]
