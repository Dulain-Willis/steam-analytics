version: 2

models:
  - name: dim_users
    description: One row per user. Type 1, latest attributes only.
    columns:
      - name: user_key
        tests: [unique, not_null]
      - name: user_id
        tests: [unique, not_null]
      - name: campaign_id
        description: >
          Immutable first-touch attribution, set once at signup. NULL =
          organic/direct (CONTEXT.md) - never a fake "organic" campaign row.
        tests:
          - relationships:
              arguments:
                to: ref('dim_marketing_campaigns')
                field: marketing_campaign_id

  - name: dim_marketing_campaigns
    description: One row per marketing campaign. Type 1, latest attributes only.
    columns:
      - name: marketing_campaign_key
        tests: [unique, not_null]
      - name: marketing_campaign_id
        tests: [unique, not_null]
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    'paid_search',
                    'paid_social',
                    'email',
                    'influencer',
                    'affiliate',
                  ]

  - name: dim_games
    description: One row per game. Type 1, latest attributes only.
    columns:
      - name: game_key
        tests: [unique, not_null]
      - name: game_id
        tests: [unique, not_null]

  - name: dim_date
    description: Date spine over the project's active window (CONTEXT.md).
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: dim_game_prices
    description: >
      SCD2. One row per game_id x region x [valid_from, valid_to), replayed
      from the price_changes event log (see int_game_prices_replayed).
      Singular tests in tests/ cover non-overlap, gap-free coverage, and
      exactly-one-current-row per game_id x region.
    columns:
      - name: game_price_key
        tests: [unique, not_null]

  - name: fct_purchases
    description: >
      One row per purchase. amount_usd is derived from amount_cents via an
      FX join to the fx_rates seed. Singular tests in tests/ cover
      amount_usd non-null / sane-ratio coverage, and that
      payment_method_bucket totals reconcile to the unbucketed total
      (#139).
    columns:
      - name: purchase_key
        tests: [unique, not_null]
      - name: user_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: payment_method
        description: >
          No check constraint on this column (db/schema.sql) -- a new
          value can appear without warning (#139). This test warns rather
          than failing the build when that happens; payment_method_bucket
          is the column consumers should actually read.
        tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['credit_card', 'paypal', 'steam_wallet']
      - name: payment_method_bucket
        description: >
          payment_method collapsed to its known values, or 'unknown' for
          anything else -- never null, so an unrecognized value can't
          fall out of every category.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'paypal', 'steam_wallet', 'unknown']

  - name: fct_refunds
    description: >
      One row per refund, valued from its linked purchase. Singular test in
      tests/ covers refunded_at >= the linked purchase's purchased_at.
    columns:
      - name: refund_key
        tests: [unique, not_null]
      - name: purchase_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_purchases')
                field: purchase_key
      - name: user_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key

  - name: fct_ownership_grants
    description: >
      One row per grant of a game to a user. source distinguishes how the
      game was acquired (purchase, gift, key_redemption).
    columns:
      - name: ownership_grant_key
        tests: [unique, not_null]
      - name: user_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: ['purchase', 'gift', 'key_redemption']

  - name: fct_playtime_sessions
    description: >
      One row per gameplay session. Open sessions (no ended_at) carry
      is_open = true and a null duration_minutes.
    columns:
      - name: playtime_session_key
        tests: [unique, not_null]
      - name: user_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: is_open
        tests: [not_null]

  - name: fct_concurrent_player_snapshots
    description: One row per game x concurrent-player snapshot.
    columns:
      - name: concurrent_player_snapshot_key
        tests: [unique, not_null]
      - name: game_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key

  - name: fct_wishlist_items
    description: >
      One row per wishlist add. removed_at is null while the item is still
      wishlisted. Singular test in tests/ covers removed_at >= added_at.
    columns:
      - name: wishlist_item_key
        tests: [unique, not_null]
      - name: user_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key

  - name: fct_dbt_test_results
    description: >
      One row per dbt schema x day. Daily test pass rate (pass_count /
      test_count) sourced from the elementary package's dbt_run_results,
      joined through dbt_tests to dbt_models for schema_name.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_date, schema_name]
    columns:
      - name: run_date
        tests: [not_null]
      - name: schema_name
        tests: [not_null]
      - name: test_count
        tests: [not_null]
      - name: pass_count
        tests: [not_null]

  - name: fct_source_freshness
    description: >
      One row per source freshness check (history, not deduped to latest),
      sourced from the elementary package's dbt_source_freshness_results
      joined to dbt_sources for readable source/table/schema names.
    columns:
      - name: source_freshness_execution_id
        tests: [unique, not_null]
      - name: unique_id
        tests: [not_null]
      - name: status
        tests: [not_null]

  - name: fct_row_counts
    description: >
      One row per table x day, snapshotting row_count from
      information_schema.tables. Independent of build frequency - captures
      today's count for every base table regardless of whether it was
      rebuilt that day. Incremental, keyed on (schema_name, table_name,
      snapshot_date).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [schema_name, table_name, snapshot_date]
    columns:
      - name: schema_name
        tests: [not_null]
      - name: table_name
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: row_count
        tests: [not_null]

seeds:
  - name: fx_rates
    description: >
      Synthetic daily FX rates (rate_to_usd) for USD/EUR/GBP/BRL/JPY over
      the project's active window. USD rows are always 1.0. The only
      reference-data seed in the project.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, currency]
    columns:
      - name: date
        tests: [not_null]
      - name: currency
        tests: [not_null]
      - name: rate_to_usd
        tests: [not_null]

unit_tests:
  - name: test_fct_purchases_payment_method_bucket
    description: >
      Model-boundary unit test (#139): a payment_method value outside the
      known set lands in the explicit 'unknown' bucket rather than null or
      falling out entirely; a known value passes through unchanged.
    model: fct_purchases
    given:
      - input: ref('int_purchases_with_fx')
        rows:
          - purchase_id: "p1"
            purchase_key: "k1"
            user_key: "u1"
            game_key: "g1"
            purchased_at: "2026-01-01T00:00:00"
            purchase_date: "2026-01-01"
            amount_cents: 1999
            currency: "USD"
            amount_usd: 19.99
            payment_method: "steam_wallet"
            is_deleted: false
          - purchase_id: "p2"
            purchase_key: "k2"
            user_key: "u2"
            game_key: "g2"
            purchased_at: "2026-06-01T00:00:00"
            purchase_date: "2026-06-01"
            amount_cents: 2999
            currency: "USD"
            amount_usd: 29.99
            payment_method: "crypto"
            is_deleted: false
    expect:
      rows:
        - purchase_key: "k1"
          payment_method: "steam_wallet"
          payment_method_bucket: "steam_wallet"
        - purchase_key: "k2"
          payment_method: "crypto"
          payment_method_bucket: "unknown"
