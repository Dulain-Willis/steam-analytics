version: 2

models:
  - name: dim_users
    description: One row per user. Type 1, latest attributes only.
    config:
      contract:
        enforced: true
    columns:
      - name: user_key
        data_type: varchar
        tests: [unique, not_null]
      - name: user_id
        data_type: varchar
        tests: [unique, not_null]
      - name: username
        data_type: varchar
      - name: country
        data_type: varchar
      - name: campaign_id
        data_type: varchar
        description: >
          Immutable first-touch attribution, set once at signup. NULL =
          organic/direct (CONTEXT.md) - never a fake "organic" campaign row.
        tests:
          - relationships:
              arguments:
                to: ref('dim_marketing_campaigns')
                field: marketing_campaign_id
      - name: created_at
        data_type: timestamp_tz
      - name: signup_date
        data_type: date
      - name: tenure_days
        data_type: number

  - name: dim_marketing_campaigns
    description: One row per marketing campaign. Type 1, latest attributes only.
    config:
      contract:
        enforced: true
    columns:
      - name: marketing_campaign_key
        data_type: varchar
        tests: [unique, not_null]
      - name: marketing_campaign_id
        data_type: varchar
        tests: [unique, not_null]
      - name: name
        data_type: varchar
      - name: channel
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    'paid_search',
                    'paid_social',
                    'email',
                    'influencer',
                    'affiliate',
                  ]
      - name: spend_cents
        data_type: number
      - name: currency
        data_type: varchar
      - name: starts_at
        data_type: timestamp_tz
      - name: ends_at
        data_type: timestamp_tz
      - name: created_at
        data_type: timestamp_tz

  - name: dim_games
    description: One row per game. Type 1, latest attributes only.
    config:
      contract:
        enforced: true
    columns:
      - name: game_key
        data_type: varchar
        tests: [unique, not_null]
      - name: game_id
        data_type: varchar
        tests: [unique, not_null]
      - name: name
        data_type: varchar
      - name: developer
        data_type: varchar
      - name: publisher
        data_type: varchar
      - name: genres
        data_type: array
      - name: languages
        data_type: array
      - name: tags
        data_type: variant
      - name: created_at
        data_type: timestamp_tz

  - name: dim_date
    description: Date spine over the project's active window (CONTEXT.md).
    config:
      contract:
        enforced: true
    columns:
      - name: date_day
        data_type: date
        tests: [unique, not_null]
      - name: year
        data_type: number
      - name: quarter
        data_type: number
      - name: month
        data_type: number
      - name: day_of_month
        data_type: number
      - name: day_of_week
        data_type: number
      - name: day_name
        data_type: varchar
      - name: week_of_year
        data_type: number
      - name: is_weekend
        data_type: boolean

  - name: dim_game_prices
    description: >
      SCD2. One row per game_id x region x [valid_from, valid_to), replayed
      from the price_changes event log (see int_game_prices_replayed).
      Singular tests in tests/ cover non-overlap, gap-free coverage, and
      exactly-one-current-row per game_id x region.
    config:
      contract:
        enforced: true
    columns:
      - name: game_price_key
        data_type: varchar
        tests: [unique, not_null]
      - name: game_id
        data_type: varchar
      - name: region
        data_type: varchar
      - name: currency
        data_type: varchar
      - name: price_cents
        data_type: number
      - name: valid_from
        data_type: timestamp_tz
      - name: valid_to
        data_type: timestamp_tz
      - name: is_current
        data_type: boolean

  - name: fct_purchases
    description: >
      One row per purchase. amount_usd is derived from amount_cents via an
      FX join to the fx_rates seed. Singular tests in tests/ cover
      amount_usd non-null / sane-ratio coverage, and that
      payment_method_bucket totals reconcile to the unbucketed total
      (#139).
    config:
      contract:
        enforced: true
    # Volume/freshness anomaly detection on purchased_at: this mart has no
    # recorded_at of its own, so these watch business-event volume/recency
    # directly - a layer dbt's native source freshness cannot reach, since
    # it only runs against declared source()s (see CONTEXT.md).
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: purchased_at
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: purchased_at
          config:
            severity: warn
    columns:
      - name: purchase_key
        data_type: varchar
        tests: [unique, not_null]
      - name: user_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: purchased_at
        data_type: timestamp_tz
      - name: purchase_date
        data_type: date
      - name: amount_cents
        data_type: number
      - name: currency
        data_type: varchar
      - name: amount_usd
        data_type: float
      - name: payment_method
        data_type: varchar
        description: >
          No check constraint on this column (db/schema.sql) -- a new
          value can appear without warning (#139). This test warns rather
          than failing the build when that happens; payment_method_bucket
          is the column consumers should actually read. The known-values
          list here is kept in sync by hand with fct_purchases.sql's
          bucketing CASE and payment_method_bucket's accepted_values
          below -- all three list the same three values.
        tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['credit_card', 'paypal', 'steam_wallet']
      - name: payment_method_bucket
        data_type: varchar
        description: >
          payment_method collapsed to its known values, or 'unknown' for
          anything else -- never null, so an unrecognized value can't
          fall out of every category. Known-values list kept in sync by
          hand with payment_method's accepted_values above.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'paypal', 'steam_wallet', 'unknown']

  - name: fct_refunds
    description: >
      One row per refund, valued from its linked purchase. Singular test in
      tests/ covers refunded_at >= the linked purchase's purchased_at.
    config:
      contract:
        enforced: true
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: refunded_at
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: refunded_at
          config:
            severity: warn
    columns:
      - name: refund_key
        data_type: varchar
        tests: [unique, not_null]
      - name: purchase_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_purchases')
                field: purchase_key
      - name: user_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: refunded_at
        data_type: timestamp_tz
      - name: refund_date
        data_type: date
      - name: is_chargeback
        data_type: boolean
      - name: refunded_amount_usd
        data_type: float

  - name: fct_ownership_grants
    description: >
      One row per grant of a game to a user. source distinguishes how the
      game was acquired (purchase, gift, key_redemption).
    config:
      contract:
        enforced: true
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: granted_at
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: granted_at
          config:
            severity: warn
    columns:
      - name: ownership_grant_key
        data_type: varchar
        tests: [unique, not_null]
      - name: user_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: source
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['purchase', 'gift', 'key_redemption']
      - name: granted_at
        data_type: timestamp_tz
      - name: revoked_at
        data_type: timestamp_tz

  - name: fct_playtime_sessions
    description: >
      One row per gameplay session. Open sessions (no ended_at) carry
      is_open = true and a null duration_minutes.
    config:
      contract:
        enforced: true
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: started_at
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: started_at
          config:
            severity: warn
    columns:
      - name: playtime_session_key
        data_type: varchar
        tests: [unique, not_null]
      - name: user_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: started_at
        data_type: timestamp_tz
      - name: started_date
        data_type: date
      - name: is_open
        data_type: boolean
        tests: [not_null]
      - name: duration_minutes
        data_type: number

  - name: fct_concurrent_player_snapshots
    description: One row per game x concurrent-player snapshot.
    config:
      contract:
        enforced: true
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: snapshot_at
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: snapshot_at
          config:
            severity: warn
    columns:
      - name: concurrent_player_snapshot_key
        data_type: varchar
        tests: [unique, not_null]
      - name: game_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: player_count
        data_type: number
      - name: snapshot_at
        data_type: timestamp_tz
      - name: snapshot_date
        data_type: date

  - name: fct_wishlist_items
    description: >
      One row per wishlist add. removed_at is null while the item is still
      wishlisted. Singular test in tests/ covers removed_at >= added_at.
    config:
      contract:
        enforced: true
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: added_at
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: added_at
          config:
            severity: warn
    columns:
      - name: wishlist_item_key
        data_type: varchar
        tests: [unique, not_null]
      - name: user_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
      - name: game_key
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_games')
                field: game_key
      - name: added_at
        data_type: timestamp_tz
      - name: added_date
        data_type: date
      - name: removed_at
        data_type: timestamp_tz

  # Pipeline Health (fct_dbt_test_results, fct_source_freshness,
  # fct_row_counts below) is deliberately NOT contracted. These are
  # internal observability facts fed by the vendored elementary package
  # (CONTEXT.md), not a business-owned shape a spoke team or external BI
  # tool depends on - and contracting them would pin this project to
  # elementary's own upstream schema, which this project does not control.
  # See #144's written record for the full "published" definition.
  - name: fct_dbt_test_results
    description: >
      One row per dbt schema x day. Daily test pass rate (pass_count /
      test_count) sourced from the elementary package's dbt_run_results,
      joined through dbt_tests to dbt_models for schema_name.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [run_date, schema_name]
    columns:
      - name: run_date
        tests: [not_null]
      - name: schema_name
        tests: [not_null]
      - name: test_count
        tests: [not_null]
      - name: pass_count
        tests: [not_null]

  - name: fct_source_freshness
    description: >
      One row per source freshness check (history, not deduped to latest),
      sourced from the elementary package's dbt_source_freshness_results
      joined to dbt_sources for readable source/table/schema names.
    columns:
      - name: source_freshness_execution_id
        tests: [unique, not_null]
      - name: unique_id
        tests: [not_null]
      - name: status
        tests: [not_null]

  - name: fct_row_counts
    description: >
      One row per table x day, snapshotting row_count from
      information_schema.tables. Independent of build frequency - captures
      today's count for every base table regardless of whether it was
      rebuilt that day. Incremental, keyed on (schema_name, table_name,
      snapshot_date).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [schema_name, table_name, snapshot_date]
    columns:
      - name: schema_name
        tests: [not_null]
      - name: table_name
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: row_count
        tests: [not_null]

unit_tests:
  - name: test_fct_wishlist_items_excludes_deleted_rows
    description: >
      #143 model-boundary unit test: a wishlist item carrying the CDC
      delete flag must not appear in fct_wishlist_items. Fixed input
      rows, independent of any live drill having run.
    model: fct_wishlist_items
    given:
      - input: ref('stg_steam__wishlist_items')
        rows:
          - wishlist_item_id: "11111111-1111-1111-1111-111111111111"
            user_id: "u1"
            game_id: "g1"
            added_at: "2024-01-01T00:00:00"
            removed_at: null
            is_deleted: false
          - wishlist_item_id: "22222222-2222-2222-2222-222222222222"
            user_id: "u2"
            game_id: "g2"
            added_at: "2024-06-01T00:00:00"
            removed_at: null
            is_deleted: true
    expect:
      rows:
        - added_date: "2024-01-01"
          removed_at: null

  - name: test_fct_playtime_sessions_excludes_deleted_rows
    description: >
      #143 model-boundary unit test: a playtime session carrying the CDC
      delete flag (compliance erasure's tier-1 hard delete, propagated
      through __deleted) must not appear in fct_playtime_sessions. Fixed
      input rows, independent of any live drill having run.
    model: fct_playtime_sessions
    given:
      - input: ref('stg_steam__playtime_sessions')
        rows:
          - playtime_session_id: "11111111-1111-1111-1111-111111111111"
            user_id: "u1"
            game_id: "g1"
            started_at: "2024-01-01T00:00:00"
            ended_at: "2024-01-01T01:00:00"
            is_deleted: false
          - playtime_session_id: "22222222-2222-2222-2222-222222222222"
            user_id: "u2"
            game_id: "g2"
            started_at: "2024-06-01T00:00:00"
            ended_at: "2024-06-01T01:00:00"
            is_deleted: true
    expect:
      rows:
        - started_date: "2024-01-01"
          is_open: false
          duration_minutes: 60

seeds:
  - name: fx_rates
    description: >
      Synthetic daily FX rates (rate_to_usd) for USD/EUR/GBP/BRL/JPY over
      the project's active window. USD rows are always 1.0. The only
      reference-data seed in the project.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, currency]
    columns:
      - name: date
        tests: [not_null]
      - name: currency
        tests: [not_null]
      - name: rate_to_usd
        tests: [not_null]

unit_tests:
  - name: test_fct_purchases_payment_method_bucket
    description: >
      Model-boundary unit test (#139): a payment_method value outside the
      known set lands in the explicit 'unknown' bucket rather than null or
      falling out entirely; a known value passes through unchanged.
    model: fct_purchases
    given:
      - input: ref('int_purchases_with_fx')
        rows:
          - purchase_id: "p1"
            purchase_key: "k1"
            user_key: "u1"
            game_key: "g1"
            purchased_at: "2026-01-01T00:00:00"
            purchase_date: "2026-01-01"
            amount_cents: 1999
            currency: "USD"
            amount_usd: 19.99
            payment_method: "steam_wallet"
            is_deleted: false
          - purchase_id: "p2"
            purchase_key: "k2"
            user_key: "u2"
            game_key: "g2"
            purchased_at: "2026-06-01T00:00:00"
            purchase_date: "2026-06-01"
            amount_cents: 2999
            currency: "USD"
            amount_usd: 29.99
            payment_method: "crypto"
            is_deleted: false
    expect:
      rows:
        - purchase_key: "k1"
          payment_method: "steam_wallet"
          payment_method_bucket: "steam_wallet"
        - purchase_key: "k2"
          payment_method: "crypto"
          payment_method_bucket: "unknown"
