name: 'steam_analytics'
version: '1.0.0'
config-version: 2

# The database is set per-target in profiles.yml (from the SNOWFLAKE_DATABASE
# env var). Schemas are derived from folder structure by the
# generate_schema_name macro in macros/.
profile: 'steam_analytics'

# dim_date's active window (see CONTEXT.md). Static bounds covering the
# synthetic data's expected range; override via --vars if the data window
# shifts.
vars:
  dim_date_start_date: '2023-01-01'
  dim_date_end_date: '2027-01-01'

seeds:
  steam_analytics:
    fx_rates:
      +column_types:
        date: date
        currency: varchar(3)
        rate_to_usd: float

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

# Elementary's on-run-end hook uploads run/test results and (for
# `dbt source freshness` invocations specifically) freshness results into the
# `elementary` schema. fct_dbt_test_results and fct_source_freshness read
# from those tables, so this hook is what feeds them. Scoped to the prod
# target only - the elementary schema is shared/unparameterized (see
# generate_schema_name.sql), so CI's per-PR scratch builds and local dev
# runs must not write into it.
on-run-end:
  - "{% if target.name == 'prod' %}{{ elementary.on_run_end() }}{% endif %}"

# Schemas are the folder-derived names below, applied verbatim in every
# environment by macros/generate_schema_name.sql.
models:
  steam_analytics:
    staging:
      +materialized: view
      +schema: stg
    intermediate:
      +materialized: view
      +schema: int
    marts:
      +materialized: table
      core:
        +schema: marts_core
      product:
        +schema: marts_product
      marketing:
        +schema: marts_marketing
      finance:
        +schema: marts_finance
  elementary:
    +schema: elementary
