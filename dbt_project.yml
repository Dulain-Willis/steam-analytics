name: 'steam_analytics'
version: '1.0.0'
config-version: 2

# The database models are built into is set per-target in profiles.yml (from
# the SNOWFLAKE_DATABASE env var) — STEAM_PROD in prod. Sources are read from
# the raw database instead, which models/staging/steam/_steam__sources.yml
# names itself. Schemas are derived from folder structure by the
# generate_schema_name macro in macros/.
profile: 'steam_analytics'

# dim_date's active window (see CONTEXT.md). Static bounds covering the
# synthetic data's expected range; override via --vars if the data window
# shifts.
#
# arrival_lookback_days: how far back an incremental merge model rescans by
# arrival timestamp (recorded_at) on every run, so a late-arriving or
# restated row still lands within the window that re-included it. See
# CONTEXT.md's "lookback window" glossary entry for why 14 and not #136's
# 7-day arrival tail directly.
vars:
  dim_date_start_date: '2023-01-01'
  dim_date_end_date: '2027-01-01'
  arrival_lookback_days: 14
  # Project-wide default time_bucket for every elementary volume_anomalies /
  # freshness_anomalies test (steam-infra #145). Every one of those tests
  # omits its own time_bucket argument on purpose, relying on elementary's
  # argument-then-var fallback (get_test_argument) to pick this up - hourly
  # buckets, so a baseline accumulates in hours of generator traffic rather
  # than days. One place to change the granularity for all ~40 tests at
  # once instead of editing each test's yml. (severity has no such project-
  # level fallback - elementary's test config scoping doesn't route through
  # package-scoped dbt_project.yml test config, confirmed empirically - so
  # severity: warn stays explicit on every test.)
  time_bucket: { period: hour, count: 1 }

seeds:
  steam_analytics:
    fx_rates:
      +column_types:
        date: date
        currency: varchar(3)
        rate_to_usd: float

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

# Feeds fct_source_freshness / fct_dbt_test_results via elementary. Runs in
# the deployed environments only — staging and prod — so a dev or CI build
# doesn't pollute the shared elementary schema. Staging is included so the
# pipeline-health models are proven before they ship (steam-infra #112 story
# 27): prod-only means the one thing nothing ever exercises before prod is the
# hook that is supposed to tell you prod is healthy.
#
# This list is deliberately the same set of targets as the bare-schema branch
# in macros/generate_schema_name.sql — the deployed environments. Add a new
# one to both or elementary silently stops running there.
on-run-end:
  - "{% if target.name in ('prod', 'staging') %}{{ elementary.on_run_end() }}{% endif %}"

# Schemas are the folder-derived names below, applied verbatim in every
# environment by macros/generate_schema_name.sql.
models:
  steam_analytics:
    staging:
      +materialized: view
      +schema: stg
    intermediate:
      +materialized: view
      +schema: int
    marts:
      +materialized: table
      core:
        +schema: marts_core
      product:
        +schema: marts_product
      marketing:
        +schema: marts_marketing
      finance:
        +schema: marts_finance
  elementary:
    +schema: elementary
