name: update-dbt-artifacts-and-docs

on:
  push:
    branches: [main]

jobs:

  serve-dbt-docs:
    runs-on: ubuntu-latest
    permissions: 
      pages: write 
      id-token: write 
    environment: github-pages

    env: 
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      # `|| 'COMPUTE_WH'` because an absent secret arrives as the empty
      # string, not as unset, so profiles.yml's default would never apply.
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE || 'COMPUTE_WH' }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE  }}
      # This job has no DBT_TARGET, so it runs as the *dev* target, whose
      # schema is now required (steam-infra #115) and prefixes every layer.
      # So `dbt docs generate` catalogues dbt_docs_* schemas that nobody
      # builds — but this job's catalog has been empty since #114 renamed
      # STEAM_PROJECT out of existence under it anyway. Both halves are fixed
      # together when steam-infra #116 gives it prod's target and the CI
      # identity; this value only keeps the parse honest until then.
      SNOWFLAKE_SCHEMA: dbt_docs

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4 

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip 

      - name: Install python packages
        run: pip install -r requirements.txt 

      - name: Install dbt packages 
        run: dbt deps 
      
      - name: Write private Snowflake key to runner disk
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_private_key.p8"
          chmod 600 "$RUNNER_TEMP/snowflake_private_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_private_key.p8" >> "$GITHUB_ENV"

      - name: Generate dbt docs
        run: dbt docs generate

      - name: Upload dbt docs code to Github Pages 
        uses: actions/upload-pages-artifact@v3
        with:
          path: target

      - name: Deploy dbt docs to Github Pages 
        uses: actions/deploy-pages@v4 
      
  update-dbt-artifacts:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: dummy
      SNOWFLAKE_USER: dummy
      SNOWFLAKE_DATABASE: dummy
      SNOWFLAKE_ROLE: dummy
      SNOWFLAKE_PRIVATE_KEY_PATH: dummy
      # Also the dev target (no DBT_TARGET), so also needs a schema now.
      # Every relation in the manifest this job publishes is therefore
      # dummy.dummy_<layer>.*, which is what slim CI defers to — see
      # steam-infra #116, which gives this job prod's target and database so
      # deferral resolves to real STEAM_PROD relations.
      SNOWFLAKE_SCHEMA: dummy

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4 

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip 

      - name: Install python packages
        run: pip install -r requirements.txt 

      - name: Install dbt packages 
        run: dbt deps 

      - name: Parse for latest manifest.json
        run: dbt parse

      - name: Upload latest manifest.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: target/manifest.json

      - name: Trigger steam-orchestration image rebuild
        env:
          DISPATCH_TOKEN: ${{ secrets.ORCHESTRATION_DISPATCH_TOKEN }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --request POST \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Dulain-Willis/steam-orchestration/dispatches" \
            --data '{"event_type":"dbt-project-updated","client_payload":{"sha":"${{ github.sha }}"}}'
