name: update-dbt-artifacts-and-docs

on:
  push:
    branches: [main]

jobs:

  serve-dbt-docs:
    runs-on: ubuntu-latest
    permissions: 
      pages: write 
      id-token: write 
    environment: github-pages

    env:
      # prod, so `dbt docs generate` catalogues the relations prod actually
      # built — the bare STEAM_PROD.{stg,int,marts_*} schemas. Before
      # steam-infra #116 this job ran with no DBT_TARGET, i.e. as the *dev*
      # target, so it catalogued prefixed schemas nobody builds and published a
      # docs site with an empty catalog.
      DBT_TARGET: prod
      # The CI identity (steam-infra #116). Its STEAM_PROD read — USAGE on the
      # database and all/future schemas, SELECT on all/future tables *and
      # views* — is exactly what a catalog query needs, and it is the same
      # grant slim-CI deferral needs, so there is one identity to rotate.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      # The prod target takes the key as *content*, not a path, so there is no
      # "write the key to disk" step here any more (there was one, for the dev
      # target's private_key_path).
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      # Literals, for the reason given in ci.yml's dbt-run job.
      SNOWFLAKE_ROLE: CI
      SNOWFLAKE_DATABASE: STEAM_PROD

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4 

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip 

      - name: Install python packages
        run: pip install -r requirements.txt 

      - name: Install dbt packages
        run: dbt deps

      - name: Generate dbt docs
        run: dbt docs generate

      - name: Upload dbt docs code to Github Pages 
        uses: actions/upload-pages-artifact@v3
        with:
          path: target

      - name: Deploy dbt docs to Github Pages 
        uses: actions/deploy-pages@v4 
      
  update-dbt-artifacts:
    runs-on: ubuntu-latest

    env:
      # This job publishes the `dbt-manifest` artifact that ci.yml's slim build
      # defers to, so its *relation names* are load-bearing: --defer rewrites
      # an unselected ref() to whatever database.schema this manifest recorded.
      # Those two values are the ones that end up there, and nothing else here
      # is (steam-infra #112's Q1):
      DBT_TARGET: prod
      SNOWFLAKE_DATABASE: STEAM_PROD
      # The rest stay dummy on purpose. `dbt parse` compiles without
      # connecting, which is how this job has always run and passed, so no
      # Snowflake identity, key or grant is involved — and not having one is
      # better than having one, since a parse needs no privileges at all.
      #
      # These are set only because profiles.yml's env_var() calls raise on an
      # *unset* variable. Note SNOWFLAKE_PRIVATE_KEY, not _PATH: the prod
      # target takes the key as content. Switching DBT_TARGET without it is a
      # parse failure that reads as a missing secret.
      SNOWFLAKE_ACCOUNT: dummy
      SNOWFLAKE_USER: dummy
      SNOWFLAKE_ROLE: dummy
      SNOWFLAKE_PRIVATE_KEY: dummy
      # No SNOWFLAKE_SCHEMA: the prod target defaults it to `prod`, and prod
      # Airflow sets nothing either (steam-infra k8s/airflow/values-prod.yaml),
      # so leaving it unset is what makes the fx_rates seed's relation in this
      # manifest match the one prod actually builds.

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4 

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip 

      - name: Install python packages
        run: pip install -r requirements.txt 

      - name: Install dbt packages 
        run: dbt deps 

      - name: Parse for latest manifest.json
        run: dbt parse

      # The one assertion that matters about the artifact below: every built
      # relation in it is in STEAM_PROD, and the sources are in STEAM_RAW. A
      # manifest naming `dummy` — or `.`, if SNOWFLAKE_DATABASE above were ever
      # emptied — uploads just as happily, and slim CI then fails in somebody
      # else's PR with "Object does not exist" against a database that was
      # never created. Cheap here, confusing there.
      - name: Assert the manifest's relations are prod's
        run: |
          strays=$(jq -r '
            [ (.nodes[]   | select(.database != "STEAM_PROD")),
              (.sources[] | select(.database != "STEAM_RAW"))
            ] | map(.database + "." + .schema + "." + .name) | unique | .[]
          ' target/manifest.json)
          if [[ -n "$strays" ]]; then
            echo "::error::manifest relations are not prod's — slim CI would defer to these:"
            echo "$strays"
            exit 1
          fi
          echo "manifest builds into STEAM_PROD and reads STEAM_RAW"

      - name: Upload latest manifest.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: target/manifest.json

      - name: Trigger steam-orchestration image rebuild
        env:
          DISPATCH_TOKEN: ${{ secrets.ORCHESTRATION_DISPATCH_TOKEN }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --request POST \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Dulain-Willis/steam-orchestration/dispatches" \
            --data '{"event_type":"dbt-project-updated","client_payload":{"sha":"${{ github.sha }}"}}'
