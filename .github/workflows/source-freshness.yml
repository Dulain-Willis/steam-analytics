name: source-freshness

# Manual trigger only — no cron schedule. Source freshness is a
# source-pipeline health signal (see issue #37): steam-infra is a toy
# project torn down between sessions, so a timer here would just fail on a
# schedule nobody's watching. Run it by hand from the Actions tab instead.
on:
  workflow_dispatch:

jobs:
  source-freshness:
    runs-on: ubuntu-latest

    # Not a PR/merge gate: this job has nothing depending on it, so a failing
    # freshness check is visible in the run's status without blocking anyone.
    #
    # Targets prod (see profiles.yml): the on-run-end hook in dbt_project.yml
    # only fires elementary's artifact upload for target.name == 'prod', so
    # this is what lets a freshness run actually feed fct_source_freshness
    # instead of getting silently dropped. The prod target takes the key as
    # raw content (SNOWFLAKE_PRIVATE_KEY) rather than a file path, so unlike
    # ci.yml there's no temp-file step here.
    env:
      DBT_TARGET: prod
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install python packages
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt source freshness
        run: dbt source freshness

      - name: Write freshness results to the job summary
        if: always()
        run: |
          {
            echo "### Source freshness results"
            echo
            echo '```json'
            cat target/sources.json 2>/dev/null || echo "dbt did not produce target/sources.json - the run likely errored before completing."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
