name: source-freshness

on:
  workflow_dispatch:

jobs:
  source-freshness:
    runs-on: ubuntu-latest

    env:
      # prod, because freshness is a statement about the data prod reads.
      # Nothing here writes: `dbt source freshness` only queries the landing
      # tables in STEAM_RAW, named by models/staging/steam/_steam__sources.yml.
      DBT_TARGET: prod
      # The CI identity, not prod's (steam-infra #116): it already reads
      # STEAM_RAW and STEAM_PROD, so prod's and staging's service keys never
      # have to leave tofu state and the Kubernetes Secrets — the only
      # Snowflake key in GitHub is CI's.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      # Literals, for the reason given in ci.yml's dbt-run job: fixed names, a
      # stale secret is invisible and a wrong literal is not. STEAM_PROD is
      # only the session's default database here; the sources name their own.
      SNOWFLAKE_ROLE: CI
      SNOWFLAKE_DATABASE: STEAM_PROD

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install python packages
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt source freshness
        run: dbt source freshness

      - name: Write freshness results to the job summary
        if: always()
        run: |
          {
            echo "### Source freshness results"
            echo
            echo '```json'
            cat target/sources.json 2>/dev/null || echo "dbt did not produce target/sources.json - the run likely errored before completing."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
