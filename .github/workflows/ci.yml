name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  parse-and-lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    env:
      DBT_TARGET: ci
      SNOWFLAKE_ACCOUNT: dummy
      SNOWFLAKE_USER: dummy
      SNOWFLAKE_DATABASE: dummy
      SNOWFLAKE_ROLE: dummy
      SNOWFLAKE_PRIVATE_KEY_PATH: dummy
      DBT_CI_SCHEMA: dummy

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install python packages
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt parse
        run: dbt parse

      - name: Find changed SQL files
        id: changed-sql
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'models/**/*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run sqlfluff linter on changed SQL files
        if: steps.changed-sql.outputs.files != ''
        run: sqlfluff lint ${{ steps.changed-sql.outputs.files }}

  sqlfmt-check:
    needs: parse-and-lint
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install python packages
        run: pip install -r requirements.txt

      - name: Find changed SQL files
        id: changed-sql
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'models/**/*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run sqlfmt (house style) on changed SQL files
        if: steps.changed-sql.outputs.files != ''
        run: sqlfmt --diff ${{ steps.changed-sql.outputs.files }}

  dbt-run:
    needs: sqlfmt-check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read

    env:
      DBT_TARGET: ci
      # The CI Snowflake identity (steam-infra #116): service user
      # STEAM_CI_SVC with role CI, which writes STEAM_DEV and *reads*
      # STEAM_PROD for slim-CI deferral — and has no grant at all on
      # STEAM_STAGING. bring-up's Stage 2 pushes the two secrets below on
      # every session, because the key pair is regenerated each time.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      # Role, database and warehouse are literals, not secrets. They are fixed
      # names (steam-infra's scripts/lib/env.sh declares them so), nothing
      # about them is secret, and a secret is the one form that can go stale
      # without anything noticing: #114 renamed STEAM_PROJECT and the
      # SNOWFLAKE_DATABASE secret kept pointing at it, which is what made this
      # job fail. A wrong literal is visible in the diff.
      SNOWFLAKE_ROLE: CI
      # STEAM_DEV, not prod: every relation this build writes is
      # STEAM_DEV.ci_pr_<N>_<layer> (macros/generate_schema_name.sql).
      SNOWFLAKE_DATABASE: STEAM_DEV
      DBT_CI_SCHEMA: ci_pr_${{ github.event.pull_request.number }}

    steps:
      - name: Checkout steam-analytics onto the runner
        uses: actions/checkout@v4 

      - name: Set up python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip 

      - name: Install python packages
        run: pip install -r requirements.txt 

      - name: Install dbt packages 
        run: dbt deps 

      - name: Write private Snowflake key to runner disk
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_private_key.p8"
          chmod 600 "$RUNNER_TEMP/snowflake_private_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_private_key.p8" >> "$GITHUB_ENV"

      - name: Download latest latest prod manifest.json 
        uses: dawidd6/action-download-artifact@v6 
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: update-dbt-artifacts-and-docs.yml
          workflow_conclusion: success
          branch: main 
          name: dbt-manifest
          path: state

      # --defer means an unselected ref() resolves to the relation recorded in
      # the downloaded manifest. Those relations are STEAM_PROD.<layer>.* only
      # because update-dbt-artifacts parses as the prod target against the prod
      # database — see that job. Deferral really does fire now: this build's own
      # relations are STEAM_DEV.ci_pr_<N>_*, so an unselected upstream model is
      # not in the current target and dbt falls back to the manifest's.
      - name: Run dbt build, deferring unchanged models to prod state
        run: dbt build --select state:modified+ --defer --state state

      # Every ci_pr_<N>* schema, not just ci_pr_<N>: a ci build writes one per
      # layer. always(), so a failed build cleans up after itself too.
      - name: Drop every CI schema this PR created
        if: always()
        run: dbt run-operation drop_ci_schema

